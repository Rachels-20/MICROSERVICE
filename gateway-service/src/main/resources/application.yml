server:
  port: 9000

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webmvc:
          routes:
          - id: PRODUK
            uri: lb://PRODUK
            predicates:
              - Path=api/produk/**
          - id: ORDER-SERVICE
            uri: lb://ORDER
            predicates:
              - Path=api/order/**
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://ms-eureka:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: always

  prometheus:
    metrics:
      export:
        enabled: true
