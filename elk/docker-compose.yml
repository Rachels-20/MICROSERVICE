services:

  elasticsearch:
    image: elasticsearch:8.13.4
    container_name: ms-elasticsearch

    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m

    ports:
      - "9201:9200"

    networks:
      - project-network
  logstash:
    image: logstash:8.13.4
    container_name: ms-logstash

    ports:
      - "5044:5044"

    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf

    depends_on:
      - elasticsearch

    networks:
      - project-network

  kibana:
    image: kibana:8.13.4
    container_name: ms-kibana

    ports:
      - "5602:5601"

    environment:
      - ELASTICSEARCH_HOSTS=http://ms-elasticsearch:9200

    depends_on:
      - elasticsearch

    networks:
      - project-network

networks:

  project-network:
    external: true
    name: project_default
